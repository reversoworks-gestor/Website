<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Scan to contact Reverso Works in Fremont, California.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#07080D">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/contact/contact.css">
  <title>Reverso Works | Contact QR Code</title>
</head>
<body class="qr-page">
  <main class="qr-card" aria-labelledby="qr-title">
    <a class="qr-brand" href="/" aria-label="Return to Reverso Works home">
      <img src="/assets/official/reverso-works-logo-white.png" width="1864" height="1587" alt="Reverso Works" decoding="async">
    </a>
    <p class="eyebrow"><span aria-hidden="true"></span>RE / CONTACT CODE</p>
    <h1 id="qr-title">Scan for<br><em>direct contact.</em></h1>
    <div class="qr-surface">
      <img src="/assets/contact/reverso-works-contact-qr.svg" width="960" height="960" alt="QR code linking to the Reverso Works contact page">
    </div>
    <p class="qr-instruction">Point your phone camera at the code to open Reverso Works contact details.</p>
    <p class="qr-url">reversoworks.com/contact</p>
    <a class="button button-primary" href="/contact/">Open contact page <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
